[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "smriti"
dynamic = ["version"]
description = "Smriti by Safearly: self-hostable, permission-aware institutional memory with cited, version-aware answers on open-weight models."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Safearly" }]
dependencies = [
  # Saaf (India-first PII masking) from its public repo until it is on PyPI
  "saaf @ git+https://github.com/physicsisawesome7/Saaf@main#subdirectory=packages/saaf-core",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",
  "pydantic>=2.6",
  "pyyaml>=6",
  "sqlalchemy>=2.0",
  "numpy>=1.26",
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "pypdf>=4",
  "python-docx>=1.1",
  "openpyxl>=3.1",
  "cryptography>=42",  # connector credentials at rest
]

[project.optional-dependencies]
tables = ["duckdb>=1.0"]
qdrant = ["qdrant-client>=1.19,<1.21"]  # within one minor of the qdrant image in compose.yaml
postgres = ["psycopg[binary]>=3.1"]
s3 = ["boto3>=1.34"]
mcp = ["mcp>=2.0,<3"]  # MCPServer API (2.x); the MCP connector and `smriti mcp`
browser = ["playwright>=1.44"]
mysql = ["pymysql>=1.1"]
all = ["smriti[tables,qdrant,postgres,s3,mcp,mysql]"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
smriti = "smriti.cli:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.version]
path = "src/smriti/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/smriti"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["E501", "S101", "S311", "RUF001", "RUF002", "RUF003", "S105", "SIM905", "RUF007"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "E402"]
"src/smriti/connectors/**" = ["RUF012"]  # declarative class-level field schemas

[tool.ruff.lint.isort]
known-first-party = ["smriti"]
