# Smriti: one-click on-premise stack. Everything is driven by .env, which the
# installer (install.sh / install.ps1) writes from deploy/profiles/<profile>.env.
#
#   ./install.sh                     detect hardware, write .env, start, wait until ready
#   docker compose up -d             start with the current .env
#   docker compose logs -f llm       watch the model load
#
# Services
#   smriti-api     web app + API (stateless, SMRITI_WORKERS processes)
#   smriti-worker  source schedules, crawls, background ingestion
#   smriti-init    one-shot: seeds the demo tenant (idempotent)
#   postgres       documents, versions, audit chain, traces
#   qdrant         dense + sparse vectors, int8-quantised, payload filters
#   llm            vLLM, OpenAI-compatible, AWQ weights          (profile: llm)
#   llm-gguf       llama.cpp, GGUF weights, for 6-8 GB GPUs      (profile: llm-gguf)
#   embed/rerank   Hugging Face TEI on the GPU                    (profile: gpu-encoders)
#   embed-cpu/...  TEI on the CPU                                 (profile: cpu-encoders)
#   sandbox        agents' Python runner: no network, read-only, non-root, capped
#   searxng        self-hosted web search for agents             (profile: search)

x-smriti: &smriti
  build: .
  image: ${SMRITI_IMAGE:-safearly/smriti:local}
  env_file: .env
  environment:
    SMRITI_DATA_DIR: /data
    SMRITI_PACKS: ${SMRITI_PACKS:-/app/packs/tenants/railways-demo}
    SMRITI_DATABASE_URL: postgresql+psycopg://smriti:${POSTGRES_PASSWORD:-smriti}@postgres:5432/smriti
    SMRITI_VECTOR_BACKEND: qdrant
    SMRITI_QDRANT_URL: http://qdrant:6333
    SMRITI_SELF_URL: http://smriti-api:8000
    SMRITI_SANDBOX_URL: ${SMRITI_SANDBOX_URL:-http://sandbox:8080}
  networks: [default, sandbox]
  volumes:
    - smriti-data:/data
    - ./packs:/app/packs:ro          # edit packs on the host; `docker compose restart smriti-api smriti-worker`
    - ${SMRITI_IMPORTS_DIR:-./imports}:/imports:ro   # folders for the "Server folder" connector
  depends_on:
    postgres: {condition: service_healthy}
    qdrant: {condition: service_started}
  restart: unless-stopped

services:
  smriti-init:
    <<: *smriti
    command: ["smriti", "seed"]
    restart: "no"

  smriti-api:
    <<: *smriti
    command: ["sh", "-c", "exec smriti serve --host 0.0.0.0 --port 8000 --workers ${SMRITI_WORKERS:-2}"]
    environment:
      SMRITI_DATA_DIR: /data
      SMRITI_PACKS: ${SMRITI_PACKS:-/app/packs/tenants/railways-demo}
      SMRITI_DATABASE_URL: postgresql+psycopg://smriti:${POSTGRES_PASSWORD:-smriti}@postgres:5432/smriti
      SMRITI_VECTOR_BACKEND: qdrant
      SMRITI_QDRANT_URL: http://qdrant:6333
      SMRITI_SELF_URL: http://smriti-api:8000
      SMRITI_SANDBOX_URL: ${SMRITI_SANDBOX_URL:-http://sandbox:8080}
      SMRITI_SCHEDULER: "0"
      SMRITI_PUBLISH_BIND: ${SMRITI_BIND:-127.0.0.1}
    ports: ["${SMRITI_BIND:-127.0.0.1}:${SMRITI_PORT:-8000}:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      qdrant: {condition: service_started}
      smriti-init: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 60s

  smriti-worker:
    <<: *smriti
    command: ["smriti", "worker"]
    depends_on:
      smriti-api: {condition: service_healthy}
    healthcheck:   # the image's check probes the API port, which the worker does not have
      test: ["CMD", "smriti", "worker", "--healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Runs code that agents write. Only reachable from the API and worker over an
  # internal network with no route out; nothing of Smriti's data is mounted.
  sandbox:
    build: .
    image: ${SMRITI_IMAGE:-safearly/smriti:local}
    command: ["smriti", "sandbox", "--host", "0.0.0.0", "--port", "8080"]
    networks: [sandbox]
    user: "65534:65534"
    read_only: true
    tmpfs: ["/tmp:size=256m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: ${SANDBOX_MEMORY:-1g}
    pids_limit: 256
    cpus: ${SANDBOX_CPUS:-1.0}
    environment: {HOME: /tmp, TMPDIR: /tmp, SMRITI_SANDBOX_TOKEN: "${SMRITI_SANDBOX_TOKEN:-}"}
    depends_on:
      smriti-init: {condition: service_completed_successfully}
    healthcheck:   # the sandbox listens on 8080, not the API's 8000
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  searxng:
    profiles: ["search"]
    image: ${SEARXNG_IMAGE:-searxng/searxng:2026.10.19-81371861f@sha256:5ed0323b5f5f8701264ef65e239a2bd83cb57098f2b971fa30bf79c06eeae271}
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:-}   # written by the installer
      SEARXNG_BASE_URL: http://searxng:8080/
    volumes: ["./deploy/searxng/settings.yml:/etc/searxng/settings.yml:ro"]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID]
    restart: unless-stopped

  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16.4-alpine@sha256:5660c2cbfea50c7a9127d17dc4e48543eedd3d7a41a595a2dfa572471e37e64c}
    environment:
      POSTGRES_USER: smriti
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smriti}
      POSTGRES_DB: smriti
    command: ["postgres", "-c", "shared_buffers=${PG_SHARED_BUFFERS:-256MB}", "-c", "max_connections=200"]
    volumes: ["pg-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smriti -d smriti"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  qdrant:
    image: ${QDRANT_IMAGE:-qdrant/qdrant:v1.20.0@sha256:9bfc89f9914fc14876a88c05270685921a55b8877b254a98bcc1cc2f0a424cd2}
    environment:
      QDRANT__STORAGE__ON_DISK_PAYLOAD: "true"
    volumes: ["qdrant-data:/qdrant/storage"]
    restart: unless-stopped

  llm:
    profiles: ["llm"]
    image: ${VLLM_IMAGE:-vllm/vllm-openai:v0.32.0@sha256:befccf0e7e4089aa23926bb6f887a85c0d46c2a99e6de5c5ffdf5cb7957c5b34}
    entrypoint: ["bash", "/smriti/vllm-entrypoint.sh"]
    env_file: .env
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-0}
    volumes:
      - ./deploy/vllm-entrypoint.sh:/smriti/vllm-entrypoint.sh:ro
      - hf-cache:/root/.cache/huggingface
    ipc: host
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: all, capabilities: [gpu]}]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 80
      start_period: 120s
    restart: unless-stopped

  # llama.cpp for small GPUs (6-8 GB): 4-bit GGUF weights, 8-bit KV cache, a
  # ~4 GB image instead of vLLM's ~20 GB. Answers on llm:8000 like vLLM, so use
  # one or the other. Weights: deploy/bench/get-gguf.sh (into the model cache).
  llm-gguf:
    profiles: ["llm-gguf"]
    image: ${LLAMACPP_IMAGE:-ghcr.io/ggml-org/llama.cpp:server-cuda@sha256:17934f68b6efc68671800735f25e209b489f47b610cfbb5c0a5c30965b54023c}
    command: >-
      -m /models/gguf/${GGUF_MODEL:-Qwen3-4B-Q4_K_M.gguf} --alias ${LLM_SERVED_NAME:-smriti-chat}
      --host 0.0.0.0 --port 8000 --jinja --metrics -ngl 99 -fa on
      -ctk ${GGUF_KV_TYPE:-q8_0} -ctv ${GGUF_KV_TYPE:-q8_0}
      -np ${LLM_MAX_NUM_SEQS:-4} -c ${GGUF_CTX:-8192} ${GGUF_EXTRA_ARGS:-}
    volumes: ["hf-cache:/models:ro"]
    networks: {default: {aliases: [llm]}}
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: all, capabilities: [gpu]}]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 60s
    restart: unless-stopped

  embed:
    profiles: ["gpu-encoders"]
    image: ${TEI_IMAGE:-ghcr.io/huggingface/text-embeddings-inference:86-1.9}
    command: ["--model-id", "${EMBED_MODEL:-Qwen/Qwen3-Embedding-0.6B}", "--dtype", "float16", "--max-batch-tokens", "${EMBED_MAX_BATCH_TOKENS:-8192}", "--max-client-batch-size", "64"]
    environment: {HF_TOKEN: "${HF_TOKEN:-}", HF_HUB_OFFLINE: "${HF_HUB_OFFLINE:-0}"}
    volumes: ["hf-cache:/data"]
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: all, capabilities: [gpu]}]
    restart: unless-stopped

  rerank:
    profiles: ["gpu-encoders"]
    image: ${TEI_IMAGE:-ghcr.io/huggingface/text-embeddings-inference:86-1.9}
    command: ["--model-id", "${RERANK_MODEL:-BAAI/bge-reranker-v2-m3}", "--dtype", "float16", "--max-batch-tokens", "${RERANK_MAX_BATCH_TOKENS:-8192}", "--max-client-batch-size", "64"]
    environment: {HF_TOKEN: "${HF_TOKEN:-}", HF_HUB_OFFLINE: "${HF_HUB_OFFLINE:-0}"}
    volumes: ["hf-cache:/data"]
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: all, capabilities: [gpu]}]
    restart: unless-stopped

  embed-cpu:
    profiles: ["cpu-encoders"]
    image: ${TEI_CPU_IMAGE:-ghcr.io/huggingface/text-embeddings-inference:cpu-1.9@sha256:2538ea1c9640d3763b15af668039d24172d063b42337b0c27796fc2be180c78d}
    command: ["--model-id", "${EMBED_MODEL:-Qwen/Qwen3-Embedding-0.6B}", "--max-batch-tokens", "${EMBED_MAX_BATCH_TOKENS:-4096}", "--max-client-batch-size", "32"]
    environment: {HF_TOKEN: "${HF_TOKEN:-}", HF_HUB_OFFLINE: "${HF_HUB_OFFLINE:-0}"}
    volumes: ["hf-cache:/data"]
    networks: {default: {aliases: [embed]}}
    restart: unless-stopped

  rerank-cpu:
    profiles: ["cpu-rerank"]
    image: ${TEI_CPU_IMAGE:-ghcr.io/huggingface/text-embeddings-inference:cpu-1.9@sha256:2538ea1c9640d3763b15af668039d24172d063b42337b0c27796fc2be180c78d}
    command: ["--model-id", "${RERANK_MODEL:-BAAI/bge-reranker-v2-m3}", "--max-batch-tokens", "${RERANK_MAX_BATCH_TOKENS:-4096}", "--max-client-batch-size", "32"]
    environment: {HF_TOKEN: "${HF_TOKEN:-}", HF_HUB_OFFLINE: "${HF_HUB_OFFLINE:-0}"}
    volumes: ["hf-cache:/data"]
    networks: {default: {aliases: [rerank]}}
    restart: unless-stopped

networks:
  default: {}
  sandbox: {internal: true}   # no gateway: the sandbox cannot reach the internet or the data services

volumes:
  smriti-data: {}
  pg-data: {}
  qdrant-data: {}
  hf-cache: {}
