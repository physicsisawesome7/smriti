name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev,qdrant,mcp,tables]"
      - run: ruff check .
      - run: ruff format --check .
      - run: smriti validate-pack packs/tenants/railways-demo
      # unit tests plus the release gates: golden set, zero leakage, red team, planted-defect recall
      - run: pytest -q

  release-gate:
    name: release gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -e ".[tables]"
      - run: smriti --data-dir /tmp/smriti seed
      - name: golden set, leakage suite and red team
        run: smriti --data-dir /tmp/smriti eval gate | tee gate.json
      - uses: actions/upload-artifact@v4
        with: {name: release-gate, path: gate.json}

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # the installer writes .env from the profiles; validate with a real one
      - run: cat deploy/profiles/_common.env deploy/profiles/gpu-12gb.env > .env && docker compose config -q
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: smriti:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pip-audit
      - name: audit pinned dependencies
        run: grep -v "^saaf @ git+" requirements.lock > /tmp/req.txt && pip-audit --strict --disable-pip -r /tmp/req.txt
