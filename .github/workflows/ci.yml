name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev,qdrant]"
      - run: ruff check .
      - run: ruff format --check .
      - run: smriti validate-pack packs/tenants/railways-demo
      # the release gates: golden set, zero leakage, red team, planted-defect recall
      - run: pytest -q
